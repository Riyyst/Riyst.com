<!DOCTYPE html>

<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Oops...</title>
<meta content="Browse developer utilities on riyst.com — grouped by category with quick-jump filters." name="description"/>

<!-- Social Preview Tags -->

<!-- JSON-LD WebSite schema -->

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "riyst.com",
    "url": "https://riyst.com",
    "description": "Tools for builders, made simple.",
    "publisher": { "@type": "Organization", "name": "riyst.com" }
  }
  </script>

<!-- Favicon -->
<link href="../media/favicon.ico" rel="icon"/>

<!-- Style -->
<style>
  :root{
    --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
    --space-0:0; --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem;
    --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem; --space-16:4rem; --space-20:5rem;
    --r-1:.375rem; --r-2:.75rem; --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45);
    --dur-fast:.15s; --dur:.25s; --dur-slow:.5s; --ease:cubic-bezier(.2,.7,.2,1);
    --font:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol;
    --max-w:1100px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility
  }
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline}
  img{max-width:100%;height:auto;display:block}

  /* Layout helpers */
  .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
  .stack{display:flex;flex-direction:column}
  .stack>*+*{margin-top:var(--space-4)}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* HEADER */
  header.site-header{
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);
    backdrop-filter:saturate(120%) blur(8px);
    border-bottom:1px solid rgba(255,255,255,.06)
  }
  .mast{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:var(--space-3) 0;
    min-height:56px
  }
  .nav__list{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.25rem;
    list-style:none;
    margin:0;
    padding:0;
    flex-wrap:wrap
  }
  .nav__link{
    display:inline-block;
    padding:.5rem .9rem;
    border-radius:999px;
    border:1px solid transparent;
    transition:border-color var(--dur), background var(--dur)
  }
  .nav__link:hover{
    text-decoration:none;
    background:rgba(139,92,246,.12);
    border-color:rgba(139,92,246,.6)
  }
  .nav__link:focus-visible{
    outline:3px solid #fff;
    box-shadow:0 0 0 4px rgba(139,92,246,.6)
  }

  /* HERO */
  .intro{
    position:relative;
    isolation:isolate;
    text-align:center;
    padding:clamp(2rem,6vw,4rem) 0 var(--space-6);
    background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)
  }
  .intro__eyebrow{
    display:inline-block;
    margin-bottom:.4rem;
    font-weight:900;
    color:#e6dbff;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.5);
    padding:.25rem .65rem;
    border-radius:999px
  }
  .intro__title{
    margin:.25rem auto 0 auto;
    line-height:1.02;
    font-size:clamp(1.8rem,5vw,2.6rem);
    font-weight:1000;
    letter-spacing:.5px;
    text-transform:uppercase
  }
  .intro__subtitle{
    margin:.5rem auto 0 auto;
    font-size:clamp(1rem,3.5vw,1.15rem);
    font-weight:800;
    color:var(--muted)
  }

  /* FOOTER */
  footer.site-footer{
    padding:0.75rem 0 1.25rem;
    border-top:1px solid rgba(255,255,255,.08);
    color:var(--muted);
    text-align:center
  }
  .footer__links{
    display:flex;
    gap:.6rem;
    flex-wrap:wrap;
    justify-content:center
  }
  .footer__links a{
    padding:.45rem .7rem;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04)
  }
  .footer__links a:hover{
    border-color:rgba(139,92,246,.6);
    background:rgba(139,92,246,.12)
  }

    /* Skip link */
    .skip-link{
      position:absolute;
      left:var(--space-4);
      top:var(--space-4);
      background:#000;
      color:#fff;
      padding:.5rem .75rem;
      border-radius:999px;
      transform:translateY(-200%);
      transition:transform var(--dur) var(--ease);
      z-index:100;
    }
    .skip-link:focus{
      transform:none;
    }

    /* Footer */
    .fine{
      font-size:.95rem;
      color:var(--muted);
    }
    footer.site-footer{
      padding:0.75rem 0 1.25rem;
      border-top:1px solid rgba(255,255,255,.08);
      color:var(--muted);
    }
    .footer-legal{
      margin-top:var(--space-2);
      display:flex;
      justify-content:center;
      gap:var(--space-3);
      font-size:.85rem;
    }
    .footer-legal a{
      color:var(--accent);
    }
    .footer-legal a:hover{
      text-decoration:underline;
    }

    /* Layout: sticky footer */
    html, body { min-height: 100%; }
    body { display:flex; flex-direction:column; }
    main { flex:1; }
    .site-footer { margin-top:auto; }

</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

<!-- Navigation Bar -->
  <header class="site-header" role="banner">
    <div class="container mast">
      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="../index.html">Home</a></li>
          <li><a class="nav__link" href="tools.html">Tools</a></li>
          <li><a class="nav__link" href="toolpages/powerful-sites.html">Powerful Websites</a></li>
          <li><a class="nav__link" href="news-and-updates.html">News & Updates</a></li>
          <li><a class="nav__link" href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>


<main id="main">
  <section class="intro">
    <div class="container stack" style="align-items:center">
      <h1 class="intro__title">Page Not Found</h1>
      <p class="intro__subtitle">
        The page you’re after doesn’t exist, was moved, or something went sideways.
      </p>
    </div>
  </section>

  <!-- Random image -->
  <section aria-label="Random 404 illustration"
           style="display:grid;place-items:center;padding:var(--space-12) 0">
    <img id="random404"
         alt="Random 404 image"
         decoding="async"
         fetchpriority="high"
         style="display:block;margin:0 auto;max-width:95%;height:auto"/>
  </section>
</main>

<!-- Footer -->
  <footer class="site-footer" role="contentinfo" >
    <div class="container" style="text-align:center; position:relative;">
      <p class="fine" style="margin:0">
        &copy; <span id="year">2025</span> riyst.com
      </p>
      <div class="footer-legal">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="https://buymeacoffee.com/riyst">Support/Donate</a>
      </div>
    </div>
  </footer>

<script>
(function () {
  const imgEl = document.getElementById('random404');
  const base = '../media/404/';
  const manifest = [
    "404_robot1.png",
    "404_robot2.png",
    "404_robot3.png",
    "404_robot4.png",
    "404_robot5.png",
    "404_robot6.png",
    "404_robot7.png"
  ];
  function pick(list){ return list[Math.floor(Math.random() * list.length)]; }
  function setSrc(src){ imgEl.src = base + src + '?v=' + Math.random().toString(36).slice(2); }
  if (manifest.length){ setSrc(pick(manifest)); }
  document.getElementById('y').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
