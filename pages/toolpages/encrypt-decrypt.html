<!-- Template header/footer styles injected -->
<style>
    :root{
      --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --space-0:0; --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem;
      --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem; --space-16:4rem; --space-20:5rem;
      --r-1:.375rem; --r-2:.75rem; --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45);
      --dur-fast:.15s; --dur:.25s; --dur-slow:.5s; --ease:cubic-bezier(.2,.7,.2,1);
      --font:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol;
      --max-w:1100px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;height:auto;display:block}

    /* Utilities */
    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
    .stack{display:flex;flex-direction:column}
    .stack>*+*{margin-top:var(--space-4)}
    .grid{display:grid;gap:var(--space-4)}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .btn{--btn-bg:transparent;--btn-text:var(--text);--btn-border:rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-radius:999px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);font-weight:700;transition:transform var(--dur) var(--ease), background var(--dur), border-color var(--dur);outline-offset:3px}
    .btn:hover{transform:translateY(-1px);text-decoration:none}
    .btn--primary{--btn-bg:var(--accent);--btn-text:#0e061d;--btn-border:transparent}
    .btn--ghost{--btn-bg:rgba(255,255,255,.06)}
    .btn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}

    .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:999px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.55);color:#e6dbff;font-size:.9rem}

    /* Skip link */
    .skip-link{position:absolute;left:var(--space-4);top:var(--space-4);z-index:1000;padding:.5rem .75rem;border-radius:var(--r-1);background:var(--accent);color:#0e061d;font-weight:800;transform:translateY(-200%);transition:transform var(--dur) var(--ease)}
    .skip-link:focus{transform:none}

    /* Header */
    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:var(--space-3) 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent;transition:border-color var(--dur), background var(--dur)}
    .nav__link:hover{text-decoration:none;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6)}
    .nav__link:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}
    .nav__link--highlight{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}

    /* Minimal hero */
    .intro{position:relative;isolation:isolate;text-align:center;padding:clamp(2rem,6vw,5rem) 0 var(--space-8);background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title--brand{margin:.2rem auto .6rem auto;line-height:1.02;font-size:clamp(2rem,5vw,3rem);font-weight:1000;letter-spacing:.5px;text-transform:uppercase}
    .intro__subtitle{margin:.2rem auto 0 auto;font-size:clamp(1.1rem,3.5vw,1.25rem);font-weight:800;color:var(--muted)}

    /* Category quick-jump chips */
    .catnav{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem}

    /* Sections & Tiles */
    .section{padding:var(--space-12) 0}
    .section__head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem;margin-bottom:var(--space-6)}
    .tiles{grid-template-columns:1fr}
    @media (min-width:48rem){.tiles{grid-template-columns:repeat(2,1fr)}}
    @media (min-width:76rem){.tiles{grid-template-columns:repeat(3,1fr)}}

    .tile{position:relative;display:flex;flex-direction:column;min-height:220px;border-radius:var(--r-2);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);transition:transform var(--dur) var(--ease), border-color var(--dur), background var(--dur)}
    .tile:hover{transform:translateY(-3px);text-decoration:none;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)}
    .tile__media{aspect-ratio:16/9;background:radial-gradient(120% 120% at 100% 0%, rgba(139,92,246,.35), transparent 60%),linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));display:grid;place-items:center;color:#e9deff;font-size:1.75rem}
    .tile__body{padding:var(--space-6);display:flex;flex-direction:column;gap:.5rem}
    .tile__title{font-size:1.1rem;margin:0;font-weight:900}
    .tile__desc{color:var(--muted);margin:0}

    /* Go circle */
    .go{position:absolute;right:10px;bottom:10px;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);background:rgba(139,92,246,.12);box-shadow:inset 0 0 0 2px rgba(139,92,246,.18);transition:transform var(--dur), background var(--dur), border-color var(--dur);pointer-events:none}
    .tile:hover .go{transform:translateX(2px);background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.9)}
    .go__arrow{font-size:1.05rem;font-weight:1000;line-height:1}

    /* Reveal-on-scroll */
    .reveal [data-reveal]{opacity:0;transform:translateY(10px)}
    .reveal.reveal-in [data-reveal]{opacity:1;transform:none;transition:opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease)}

    /* Footer */
    footer.site-footer{padding:var(--space-12) 0 var(--space-16);border-top:1px solid rgba(255,255,255,.08);color:var(--muted)}
    .footer__grid{display:grid;gap:var(--space-6)}
    @media (min-width:48rem){.footer__grid{grid-template-columns:1fr auto}}
    .footer__links,.social{display:flex;gap:.6rem;flex-wrap:wrap}
    .footer__links a,.social a{padding:.45rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
    .footer__links a:hover{border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.12)}
    .footer__links a:focus-visible,.social a:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}
  </style>

<style>

  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
}

/* Base chip */
.catnav .chipwrap.chip--with-sub > .chip {
  transition: border-radius 120ms ease;
  z-index: 2;
}

  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.catnav .chipwrap .chip-dropdown {
  display: none;
  position: static;   /* stack naturally below */
  width: 100%;
  padding: 0;         /* no panel look */
  margin-top: 6px;    /* tiny gap between main chip and first option */

  border: 0;

<main id="main">
    <section class="intro">

    <section class="tool">
      <div class="container">
        <div class="card" role="region" aria-label="AES-GCM encrypt/decrypt tool">

          <!-- Mode selector at the top -->
          <div class="mode" role="tablist" aria-label="Mode">
            <div class="seg">
              <button id="modeEncrypt" role="tab" aria-selected="true">Encrypt</button>
              <button id="modeDecrypt" role="tab" aria-selected="false">Decrypt</button>

          <!-- Upload (Decrypt mode ONLY) -->

              <div class="drop-merge" id="dropMerge" role="button" tabindex="0" aria-label="Choose encrypted JSON file">

              </div>
              <div class="msg" id="fileMeta" aria-live="polite"></div>

          <!-- Single textarea (Encrypt: always visible; Decrypt: appears only after successful password) -->
          <div class="row" id="rowText">
            <div class="full">
              <label for="ioText">Text</label>
              <div class="preview"><textarea id="ioText" placeholder="Type text to encrypt…" aria-label="Text input and output"></textarea></div>
              <div class="actions" id="actionsEncrypt">
                <button class="btn small" id="btnClear" type="button">Clear</button>
              </div>
            </div>
          </div>

          <!-- Password row (Encrypt: always; Decrypt: after file upload) -->
          <div class="row" id="rowPassword">
            <div class="full">
              <label for="password">Password / Passphrase</label>
              <div class="input-wrap">
                <input id="password" type="password" placeholder="Enter a strong password…" autocomplete="new-password" />
                <!-- Generate icon (refresh arrows) — Encrypt mode only, right side -->
                <button class="gen-btn" id="btnGen" type="button" title="Generate and copy a strong password" aria-label="Generate password">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0114.13-3.36L23 10"></path>
                    <path d="M20.49 15a9 9 0 01-14.13 3.36L1 14"></path>
                  </svg>
                </button>
                <!-- Eye icon -->
                <button class="eye-btn" id="togglePwd" type="button" title="Show/Hide password" aria-label="Show password">
                  <svg class="icon" id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>

  <script>
    // ---- Shorthands ----
    const $ = sel => document.querySelector(sel);
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    // ---- Elements ----
    const modeEncrypt = $('#modeEncrypt');
    const modeDecrypt = $('#modeDecrypt');
    const rowUpload = $('#rowUpload');
    const dropMerge = $('#dropMerge');
    const fileInput = $('#fileInput');
    const fileMeta = $('#fileMeta');
    const rowText = $('#rowText');
    const ioText = $('#ioText');
    const actionsEncrypt = $('#actionsEncrypt');
    const btnClear = $('#btnClear');
    const rowPassword = $('#rowPassword');
    const pwd = $('#password');
    const togglePwd = $('#togglePwd');
    const eyeIcon = $('#eyeIcon');
    const btnGen = $('#btnGen');
    const rowRun = $('#rowRun');
    const btnEncrypt = $('#btnEncrypt');
    const hint = $('#hint');

    // ---- Config ----
    const DEFAULT_ITERS = 350000; // fixed
    let decryptEnvelope = null; // holds uploaded JSON for decrypt

    // ---- Base64 helpers ----
    function toB64(bytes){
      let bin = ''; const arr = new Uint8Array(bytes);
      for(let i=0;i<arr.length;i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin);
    }
    function fromB64(b64){
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      return arr.buffer;
    }
    function randBytes(len){ const b = new Uint8Array(len); crypto.getRandomValues(b); return b; }

    // ---- Crypto (Web Crypto) ----
    async function deriveKey(password, salt, iterations){
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', hash:'SHA-256', salt, iterations},
        keyMaterial,
        {name:'AES-GCM', length:256},
        false,
        ['encrypt','decrypt']
      );
    }
    async function encryptText(plaintext, password){
      if(!password) throw new Error('Password required');
      const salt = randBytes(16); // 128-bit
      const iv = randBytes(12);   // 96-bit
      const key = await deriveKey(password, salt, DEFAULT_ITERS);
      const alg = {name:'AES-GCM', iv};
      const ct = await crypto.subtle.encrypt(alg, key, enc.encode(plaintext || ''));
      const envelope = {
        v: 1,
        scheme: 'AES-GCM',
        kdf: { name:'PBKDF2', hash:'SHA-256', iterations: DEFAULT_ITERS },
        salt: toB64(salt),
        iv: toB64(iv),
        ct: toB64(ct)
      };
      return JSON.stringify(envelope, null, 2);
    }
    async function decryptText(envelopeJSON, password){
      if(!password) throw new Error('Password required');
      const env = JSON.parse(envelopeJSON);
      if(env.v !== 1) throw new Error('Unsupported version');
      if(!env.kdf || env.kdf.name !== 'PBKDF2' || env.kdf.hash !== 'SHA-256') throw new Error('Unsupported KDF');
      const salt = new Uint8Array(fromB64(env.salt));
      const iv = new Uint8Array(fromB64(env.iv));
      const key = await deriveKey(password, salt, Number(env.kdf.iterations));
      const alg = {name:'AES-GCM', iv};
      const ptBuf = await crypto.subtle.decrypt(alg, key, fromB64(env.ct));
      return dec.decode(ptBuf);
    }

    // ---- Password show/hide ----
    togglePwd.addEventListener('click', ()=>{
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      togglePwd.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      // toggle eye icon
      eyeIcon.innerHTML = show
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.23 4.31M1 1l22 22" />'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    // ---- Password generator + copy (Encrypt mode only) ----
    btnGen.addEventListener('click', async ()=>{
      const strong = generatePassword(20);
      pwd.value = strong;
      try {
        await navigator.clipboard.writeText(strong);
        flashHint('Strong password generated & copied', true);
      } catch {
        flashHint('Strong password generated (copy failed)', false);
      }
      pwd.focus(); pwd.select(); // allow manual copy if needed
    });
    function generatePassword(length=20){
      const upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lower='abcdefghijklmnopqrstuvwxyz';
      const nums='0123456789';
      const syms='!@#$%^&*()-_=+[]{};:,.<>?';
      const all = upper+lower+nums+syms;
      const req = [upper, lower, nums, syms];
      let res = [];
      req.forEach(set => res.push(set[rand(set.length)]));
      for(let i=res.length;i<length;i++){ res.push(all[rand(all.length)]); }
      for(let i=res.length-1;i>0;i--){ const j = rand(i+1); [res[i],res[j]]=[res[j],res[i]]; }
      return res.join('');
    }
    function rand(n){ return crypto.getRandomValues(new Uint32Array(1))[0] % n; }
    function flashHint(msg, ok){
      hint.textContent = msg; hint.className = 'msg ' + (ok?'ok':'err');
      setTimeout(()=>{ hint.textContent=''; hint.className='msg'; }, 1800);
    }

    // ---- Encrypt flow ----
    btnClear.addEventListener('click', ()=>{ ioText.value=''; });
    btnEncrypt.addEventListener('click', async ()=>{
      try{
        const out = await encryptText(ioText.value || '', pwd.value || '');
        ioText.value = out;
        const blob = new Blob([out], {type:'application/json'});
        const ts = new Date().toISOString().replace(/[:.]/g,'-');
        downloadBlob(blob, `encrypted-${ts}.json`);
      }catch(e){
        alert(e.message || 'Encryption failed');
      }
    });
    function downloadBlob(blob, filename){
      if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, filename); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display='none';
      document.body.appendChild(a);
      requestAnimationFrame(()=>{ try{ a.click(); }catch(_){}
        setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
      });
    }

    // ---- Mode management & Decrypt flow ----
    function clearPassword(){
      pwd.value = '';
      pwd.type = 'password';
      togglePwd.setAttribute('aria-label','Show password');
      eyeIcon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>';
    }

    
    function setMode(mode){
      const isEncrypt = mode === 'encrypt';
      modeEncrypt.setAttribute('aria-selected', String(isEncrypt));
      modeDecrypt.setAttribute('aria-selected', String(!isEncrypt));
      rowUpload.style.display = isEncrypt ? 'none' : '';
      if (dropMerge) dropMerge.style.display = isEncrypt ? 'none' : 'flex';
      rowPassword.style.display = isEncrypt ? '' : (decryptEnvelope ? '' : 'none');
      pwd.placeholder = isEncrypt ? 'Enter a strong password…' : 'Enter the password';
      if (btnGen) btnGen.style.display = isEncrypt ? '' : 'none';
      rowPassword.classList.toggle('with-gen', isEncrypt);
      rowText.style.display = isEncrypt ? '' : (ioText.dataset.unlocked === 'true' ? '' : 'none');
      actionsEncrypt.style.display = isEncrypt ? '' : 'none';
      rowRun.style.display = isEncrypt ? '' : 'none';
      ioText.readOnly = !isEncrypt;
      ioText.placeholder = isEncrypt ? 'Type text to encrypt…' : '';
      ioText.value = ''; // always clear text area on mode switch
      ioText.dataset.unlocked = isEncrypt ? 'false' : 'false';
      hint.textContent = '';
      clearPassword();
    }

    modeEncrypt.addEventListener('click', ()=> setMode('encrypt'));
    modeDecrypt.addEventListener('click', ()=> setMode('decrypt'));
    setMode('encrypt'); // default

    // Upload handlers (Decrypt mode)
    if(dropMerge){
      dropMerge.addEventListener('click', ()=>{ if(fileInput) fileInput.click(); });
      dropMerge.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(fileInput) fileInput.click(); }});
      dropMerge.addEventListener('dragover', (e)=>{ e.preventDefault(); dropMerge.style.background='rgba(255,255,255,.08)'; });
      dropMerge.addEventListener('dragleave', ()=>{ dropMerge.style.background='rgba(255,255,255,.05)'; });
      dropMerge.addEventListener('drop', async (e)=>{
        e.preventDefault(); dropMerge.style.background='rgba(255,255,255,.05)';
        const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) await handleFile(f);
      });
    }
    if(fileInput){
      fileInput.addEventListener('change', async (e)=>{
        if(e.target.files && e.target.files[0]){ await handleFile(e.target.files[0]); e.target.value=''; }
      });
    }
    async function handleFile(file){
      const name = (file.name||'').toLowerCase();
      if(!name.match(/\.(json|enc|cipher)$/)){ alert('Please choose an encrypted JSON (.json/.enc/.cipher)'); return; }
      try{
        decryptEnvelope = await file.text();
        fileMeta.textContent = 'Loaded: ' + (file.name || 'file');
        rowPassword.style.display = '';
        pwd.placeholder = 'Enter the password';
        clearPassword(); // ensure no remembered password
        pwd.focus();
      }catch(_){ alert('Unable to read file'); }
    }

    // Only decrypt on Enter key
    pwd.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && decryptEnvelope){
        e.preventDefault();
        triggerDecrypt();
      }
    });
    async function triggerDecrypt(){
      try{
        const out = await decryptText(decryptEnvelope, pwd.value || '');
        ioText.value = out;
        ioText.readOnly = true;
        ioText.dataset.unlocked = 'true';
        rowText.style.display = '';     // reveal preview
        rowPassword.style.display = 'none'; // hide password box after success
        clearPassword(); // wipe password after use
        flashHint('Decrypted', true);
      }catch(e){
        hint.textContent = 'Wrong password or corrupted file';
        hint.className = 'msg err';
      }
    }
  </script>
