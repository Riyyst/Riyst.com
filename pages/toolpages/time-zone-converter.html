  <style>
    :root{
      --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --space-0:0; --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem;
      --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem; --space-16:4rem; --space-20:5rem;
      --r-1:.375rem; --r-2:.75rem; --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45);
      --dur-fast:.15s; --dur:.25s; --dur-slow:.5s; --ease:cubic-bezier(.2,.7,.2,1);
      --font:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol;
      --max-w:1100px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;height:auto;display:block}

    /* Utilities */
    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
    .stack{display:flex;flex-direction:column}
    .stack>*+*{margin-top:var(--space-4)}
    .grid{display:grid;gap:var(--space-4)}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .btn{--btn-bg:transparent;--btn-text:var(--text);--btn-border:rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-radius:999px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);font-weight:700;transition:transform var(--dur) var(--ease), background var(--dur), border-color var(--dur);outline-offset:3px}
    .btn:hover{transform:translateY(-1px);text-decoration:none}
    .btn--primary{--btn-bg:var(--accent);--btn-text:#0e061d;--btn-border:transparent}
    .btn--ghost{--btn-bg:rgba(255,255,255,.06)}
    .btn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}

    .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:999px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.55);color:#e6dbff;font-size:.9rem}

    /* Skip link */
    .skip-link{position:absolute;left:var(--space-4);top:var(--space-4);z-index:1000;padding:.5rem .75rem;border-radius:var(--r-1);background:var(--accent);color:#0e061d;font-weight:800;transform:translateY(-200%);transition:transform var(--dur) var(--ease)}
    .skip-link:focus{transform:none}

    /* Header */
    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:var(--space-3) 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent;transition:border-color var(--dur), background var(--dur)}
    .nav__link:hover{text-decoration:none;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6)}
    .nav__link:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}
    .nav__link--highlight{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}

    /* Minimal hero */
    .intro{position:relative;isolation:isolate;text-align:center;padding:clamp(2rem,6vw,5rem) 0 var(--space-8);background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title--brand{margin:.2rem auto .6rem auto;line-height:1.02;font-size:clamp(2rem,5vw,3rem);font-weight:1000;letter-spacing:.5px;text-transform:uppercase}
    .intro__subtitle{margin:.2rem auto 0 auto;font-size:clamp(1.1rem,3.5vw,1.25rem);font-weight:800;color:var(--muted)}

    /* Category quick-jump chips */
    .catnav{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem}

    /* Sections & Tiles */
    .section{padding:var(--space-12) 0}
    .section__head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem;margin-bottom:var(--space-6)}
    .tiles{grid-template-columns:1fr}
    @media (min-width:48rem){.tiles{grid-template-columns:repeat(2,1fr)}}
    @media (min-width:76rem){.tiles{grid-template-columns:repeat(3,1fr)}}

    .tile{position:relative;display:flex;flex-direction:column;min-height:220px;border-radius:var(--r-2);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);transition:transform var(--dur) var(--ease), border-color var(--dur), background var(--dur)}
    .tile:hover{transform:translateY(-3px);text-decoration:none;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)}
    .tile__media{aspect-ratio:16/9;background:radial-gradient(120% 120% at 100% 0%, rgba(139,92,246,.35), transparent 60%),linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));display:grid;place-items:center;color:#e9deff;font-size:1.75rem}
    .tile__body{padding:var(--space-6);display:flex;flex-direction:column;gap:.5rem}
    .tile__title{font-size:1.1rem;margin:0;font-weight:900}
    .tile__desc{color:var(--muted);margin:0}

    /* Go circle */
    .go{position:absolute;right:10px;bottom:10px;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);background:rgba(139,92,246,.12);box-shadow:inset 0 0 0 2px rgba(139,92,246,.18);transition:transform var(--dur), background var(--dur), border-color var(--dur);pointer-events:none}
    .tile:hover .go{transform:translateX(2px);background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.9)}
    .go__arrow{font-size:1.05rem;font-weight:1000;line-height:1}

    /* Reveal-on-scroll */
    .reveal [data-reveal]{opacity:0;transform:translateY(10px)}
    .reveal.reveal-in [data-reveal]{opacity:1;transform:none;transition:opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease)}

    /* Footer */
    footer.site-footer{padding:0.75rem 0 1.25rem;border-top:1px solid rgba(255,255,255,.08);color:var(--muted)}
    .footer__grid{display:grid;gap:var(--space-6)}
    @media (min-width:48rem){.footer__grid{grid-template-columns:1fr auto}}
    .footer__links,.social{display:flex;gap:.6rem;flex-wrap:wrap}
    .footer__links a,.social a{padding:.45rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
    .footer__links a:hover{border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.12)}
    .footer__links a:focus-visible,.social a:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}
  
    /* Layout: sticky footer */
    html, body { min-height: 100%; }
    body { display:flex; flex-direction:column; }
    main { flex:1; }
    .site-footer { margin-top:auto; }

</style>

<style>
/* --- Expanding chip with integrated subcategories --- */
.catnav { display: flex; flex-wrap: wrap; gap: 12px; }

/* Wrapper turns into a vertical stack */

}

}
</style>
<style>

    .intro__title { margin:.2rem auto .4rem auto; line-height:1.02; font-size:clamp(1.8rem,4vw,2.4rem); font-weight:1000; letter-spacing:.4px; }
    .intro__subtitle { margin:0 auto; color:var(--muted); font-weight:800; }

    .tool { padding:2.4rem 0 4rem; }
    .card { background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
             border:1px solid rgba(255,255,255,.12); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.45);
             padding:1.4rem; max-width:980px; margin:0 auto; }
    .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:14px; }
    .col { flex:1 1 360px; min-width:300px; max-width:520px; }
    .arrow { font-size:clamp(1.6rem,4vw,2.2rem); font-weight:1000; color:#e7e6ff; user-select:none; position:relative; top:8px; }
    label { font-size:.85rem; color:var(--muted); display:block; margin-bottom:.35rem; }

    input[type="text"], input[type="date"], input[type="time"], select {
      height:46px; width:100%; padding:0 12px; border-radius:12px; border:1px solid var(--select-border);
      background:var(--select-bg); color:#e7e6ff; outline:none; appearance:none;
      font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1;
    }
    input::placeholder { color:#cbd0ddaa }
    select option { background:var(--select-option-bg); color:var(--select-option-text) }

    .pair { display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
    .boxcol { display:grid; grid-template-columns:minmax(150px,1fr) minmax(160px,1fr); gap:10px; flex:2 1 380px; min-width:280px; }
    .unit { flex:1 1 240px; min-width:220px; }

    .preview { display:grid; grid-template-columns:minmax(150px,1fr) minmax(180px,1fr); gap:10px; flex:2 1 380px; min-width:280px; }
    .preview input[readonly] { border:1px solid var(--select-border); background:#0a0f1a; border-radius:12px; }

    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:.6rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.6rem; padding:.6rem 1rem; border-radius:999px; border:1px solid rgba(255,255,255,.18);
           background:rgba(255,255,255,.07); color:#e7e6ff; font-weight:900; }
    .btn.small { padding:.45rem .85rem; }
  </style>

  <style>
    /* Ensure converter inputs/selects are visibly boxed inside the card,
       regardless of template overrides */
    .card input[type="date"],
    .card input[type="time"],
    .card input[type="text"],
    .card select {
      height: 46px;
      background: var(--select-bg, rgba(255,255,255,.07)) !important;
      border: 1px solid var(--select-border, rgba(255,255,255,.18)) !important;
      border-radius: 12px;
      color: #e7e6ff;
      padding: 0 12px;
    }
    .card .preview input[readonly] {
      background: #0a0f1a !important;
      border: 1px solid var(--select-border, rgba(255,255,255,.18)) !important;
    }
    /* Prevent collapsing of grid cells so fields are visible */
    .card .boxcol,
    .card .preview {
      min-width: 280px;
    }
  </style>


  <style>
    /* Dark mode selection menus (simple, no glow/animation) */
    .card select,
    .card input[type="date"],
    .card input[type="time"] {
      background: #0f121a !important;
      color: #f6f7fb !important;
      border: 1px solid rgba(255,255,255,.18) !important;
      color-scheme: dark;
    }
    /* Dropdown list items */
    .card select option,
    .card select optgroup {
      background: #0f121a !important;
      color: #e7e6ff !important;
    }
    /* Calendar/clock icons on WebKit */
    .card input[type="date"]::-webkit-calendar-picker-indicator,
    .card input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.9);
      opacity: 0.9;
    }
    /* Firefox date/time inner fields inherit text color */
    .card input[type="date"]::-moz-focus-inner,
    .card input[type="time"]::-moz-focus-inner {
      color: #f6f7fb;
      border: 0;
    }
  </style>


  <style>
    /* Ensure calendar and clock icons match text tone for visibility */
    .card input[type="date"]::-webkit-calendar-picker-indicator,
    .card input[type="time"]::-webkit-calendar-picker-indicator {
      filter: brightness(10) saturate(0) invert(1);
      opacity: 1;
    }
    /* For browsers that support accent-color or color-scheme dark mode */
    .card input[type="date"],
    .card input[type="time"] {
      color-scheme: dark;
      accent-color: #f6f7fb;
    }
  
    /* Footer */
    .fine{
      font-size:.95rem;
      color:var(--muted);

    footer.site-footer{
      padding:0.75rem 0 1.25rem;
      border-top:1px solid rgba(255,255,255,.08);
      color:var(--muted);

    .footer-legal{
      margin-top:var(--space-2);
      display:flex;
      justify-content:center;

      font-size:.85rem;
    }
    .footer-legal a{
      color:var(--accent);

    .footer-legal a:hover{
      text-decoration:underline;
    }
</style>

</head>
<body>

  <main id="main">
    <section class="intro">
      <div class="container">
        <h1 class="intro__title">Time Zone Converter</h1>
        <p class="intro__subtitle">Pick a date &amp; time and convert it between common time zones — fully offline.</p>
      </div>
    </section>

    <section class="tool">
      <div class="container">
        <div class="card" role="region" aria-label="Time zone converter">
          <div class="row" id="converterRow">
            <!-- FROM -->
            <div class="col">
              <label class="center">From</label>
              <div class="pair">
                <div class="boxcol">
                  <input id="fromDate" type="date" aria-label="From date" placeholder="YYYY-MM-DD" />
                  <input id="fromTime" type="time" step="60" aria-label="From time" placeholder="HH:MM" />
                </div>
                <select id="fromZone" class="unit" aria-label="Timezone"></select>
              </div>
            </div>

            <div class="arrow" aria-hidden="true">→</div>

            <!-- TO -->
            <div class="col">
              <label class="center">To</label>
              <div class="pair">
                <div class="preview">
                  <input id="toDate" type="text" aria-label="Converted date" readonly />
                  <input id="toTime" type="text" aria-label="Converted time" readonly />
                </div>
                <select id="toZone" class="unit" aria-label="Timezone"></select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="actions">
              <button id="reset" class="btn small" type="button">Clear</button>
            </div>
          </div>

  <script>
  (function(){
    var $ = function(s, root){ return (root||document).querySelector(s); };

    var fromDate = $('#fromDate');
    var fromTime = $('#fromTime');
    var fromZone = $('#fromZone');
    var toZone   = $('#toZone');
    var toDate   = $('#toDate');
    var toTime   = $('#toTime');
    var btnReset = $('#reset');

    /* --- Simplified, common time zones (ascending from -08:00 to +12:00) --- */
    var ZONES = [
      {name:'US Pacific',               offset:-8*60},
      {name:'US Mountain',              offset:-7*60},
      {name:'US Central',               offset:-6*60},
      {name:'US Eastern',               offset:-5*60},
      {name:'Canada Atlantic',          offset:-4*60},
      {name:'Argentina / Brazil',       offset:-3*60},
      {name:'UTC / GMT',                offset: 0},
      {name:'Central European (CET)',   offset: 1*60},
      {name:'Eastern European (EET)',   offset: 2*60},
      {name:'Moscow',                   offset: 3*60},
      {name:'Gulf',                     offset: 4*60},
      {name:'Pakistan',                 offset: 5*60},
      {name:'India (IST)',              offset: 5*60+30},
      {name:'Indochina',                offset: 7*60},
      {name:'China / Singapore',        offset: 8*60},
      {name:'Japan / Korea',            offset: 9*60},
      {name:'Australia Eastern (AEST)', offset:10*60},
      {name:'New Zealand',              offset:12*60}
    ];

    function fmtOffsetLabel(mins){
      var sign = mins>=0 ? '+' : '−';
      var abs = Math.abs(mins);
      var h = Math.floor(abs/60);
      var m = abs%60;
      return '(UTC ' + sign + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ')';
    }
    function buildZoneSelect(sel){
      sel.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '__placeholder__';
      opt0.textContent = 'Timezone';
      opt0.disabled = true; opt0.selected = true;
      sel.appendChild(opt0);
      ZONES.forEach(function(z){
        var opt = document.createElement('option');
        opt.value = z.offset; // minutes
        opt.textContent = z.name + ' ' + fmtOffsetLabel(z.offset);
        sel.appendChild(opt);
      });
    }

    function parseDate(s){
      if(!s) return null;
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return null;
      return {y:+m[1], mo:+m[2]-1, d:+m[3]};
    }
    function parseTime(s){
      if(!s) return null;
      var m = s.match(/^(\d{2}):(\d{2})(?::(\d{2}))?$/);
      if(!m) return null;
      return {H:+m[1], M:+m[2], S: m[3]?+m[3]:0};
    }

    function instantFromWallClock(dateParts, timeParts, offsetMins){
      if(!dateParts || !timeParts || typeof offsetMins!=='number') return null;
      var tsUTC = Date.UTC(dateParts.y, dateParts.mo, dateParts.d, timeParts.H, timeParts.M, timeParts.S || 0);
      return tsUTC - offsetMins*60*1000;
    }

    function convert(){
      var d = parseDate(fromDate.value);
      var t = parseTime(fromTime.value);
      var fromOff = parseInt(fromZone.value, 10);
      var toOff   = parseInt(toZone.value, 10);

      if(!d || !t || isNaN(fromOff) || isNaN(toOff)){
        toDate.value = ''; toTime.value = '';
        return;
      }

      var utcMs = instantFromWallClock(d, t, fromOff);
      if(utcMs == null || isNaN(utcMs)){
        toDate.value = ''; toTime.value = '';
        return;
      }

      // Shift by target offset and use UTC getters to avoid local TZ interference
      var shifted = new Date(utcMs + toOff*60*1000);
      var yyyy = shifted.getUTCFullYear();
      var mm   = String(shifted.getUTCMonth()+1).padStart(2,'0');
      var dd   = String(shifted.getUTCDate()).padStart(2,'0');
      var H    = String(shifted.getUTCHours()).padStart(2,'0');
      var M    = String(shifted.getUTCMinutes()).padStart(2,'0');
      var S    = String(shifted.getUTCSeconds()).padStart(2,'0');

      // Output date as DD/MM/YYYY (matches your request)
      toDate.value = dd + '/' + mm + '/' + String(yyyy);
      toTime.value = H + ':' + M + ':' + S;
    }

    function setBlank(){
      buildZoneSelect(fromZone);
      buildZoneSelect(toZone);
      fromDate.value = ''; fromTime.value = '';
      toDate.value = ''; toTime.value = '';
    }

    ['change','input'].forEach(function(ev){
      fromDate.addEventListener(ev, convert);
      fromTime.addEventListener(ev, convert);
      fromZone.addEventListener(ev, convert);
      toZone.addEventListener(ev, convert);
    });

    var btnReset = document.getElementById('reset');
    if(btnReset) btnReset.addEventListener('click', setBlank);

    setBlank();
  })();
  </script>
</body>
