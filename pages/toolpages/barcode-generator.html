<!-- Style -->
  <style>
    :root{
      --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --max-w:1100px; --ctl-h:46px; --gap:14px; --radius:12px;
      --stack-gap:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* Header */
    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:1rem 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent;text-decoration:none}
    .nav__link:hover{text-decoration:none;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6)}

    /* Intro */
    .intro{position:relative;text-align:center;padding:clamp(1.5rem,5vw,3rem) 0 1.5rem;background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title--brand{margin:.2rem auto .6rem auto;line-height:1.02;font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:1000;letter-spacing:.5px;text-transform:uppercase}
    .intro__subtitle{margin:.2rem auto 0 auto;font-size:clamp(1rem,3vw,1.1rem);font-weight:800;color:var(--muted)}

    /* Card + layout */
    .tool{padding:1rem 0 2.25rem}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:1.1rem}
    .row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:flex-start;justify-content:center}
    .left{display:none}
    .right{flex:0 1 100%;max-width:100%;display:flex;flex-direction:column;align-items:center}

    /* Buttons / controls */
    .actions-line{display:flex;justify-content:center;width:100%}
    .controls-inline{display:flex;gap:.6rem;align-items:center;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:.6rem;padding:.7rem 1.05rem;border-radius:999px;border:1px solid transparent;background:linear-gradient(135deg,#7aa2ff,#b18bff);color:#0e061d;font-weight:900;transition:transform .06s ease;box-shadow:none;text-decoration:none;white-space:nowrap}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn[disabled]{opacity:.55;cursor:not-allowed;filter:saturate(.4) brightness(.9)}
    label{font-size:.85rem;color:var(--muted);display:block;margin:.25rem 0 .35rem;text-align:center}
    input.inline, select.shrunk{height:var(--ctl-h);padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#e7e6ff;outline:none}
    input.inline{min-width:160px}
    select.shrunk{min-width:160px;max-width:220px}

    /* Preview */
    .canvas{border-radius:16px;overflow:auto;border:1px solid rgba(255,255,255,.12);background:#0a0f1a;display:none;margin:var(--stack-gap) auto 0 auto}
    #previewBox{padding:8px}
    #mount{display:grid;place-items:center;}

    /* Footer */
    footer.site-footer{padding:1.5rem 0;border-top:1px solid rgba(255,255,255,.06);text-align:center;color:var(--muted)}
  </style>

<body>

    <div class="container mast">
      <nav class="nav" aria-label="Primary">

  <main id="main" tabindex="-1">
    <section class="intro">
      <div class="container">
        <h1 class="intro__title--brand">BARCODE GENERATOR</h1>
        <p class="intro__subtitle">Generate a basic barcode instantly; numbers are shown under the stripes. Fully offline.</p>
      </div>
    </section>

    <section class="tool">
      <div class="container card">
        <div class="row">
          <div class="left"></div>

          <div class="right">
            <!-- Generate centered -->
            <div class="actions-line" style="margin-bottom:var(--stack-gap)">
              <button id="btnGenerate" class="btn">Generate barcode</button>
            </div>

            <!-- Optional descriptor fields -->
            <div class="controls-inline" style="margin-bottom:var(--stack-gap)">
              <label class="sr-only" for="nameField">Name</label>
              <input id="nameField" class="inline" type="text" placeholder="Name (optional)" />
              <label class="sr-only" for="locField">Location</label>
              <input id="locField" class="inline" type="text" placeholder="Location (optional)" />
              <label class="sr-only" for="itemField">Item</label>
              <input id="itemField" class="inline" type="text" placeholder="Item (optional)" />
            </div>

            <!-- Preview centered (auto-width), hidden until generated -->
            <div id="previewWrapper" class="canvas" aria-hidden="true">
              <div id="previewBox">
                <div id="mount" aria-live="polite"></div>
              </div>
            </div>

            <!-- Downloads centered, hidden until generated -->
            <div id="downloads" class="controls-inline" style="margin-top:var(--stack-gap); display:none">
              <label for="fmt" style="margin:0 8px 0 0">Download format</label>
              <select id="fmt" class="shrunk">
                <option value="png" selected>PNG</option>
                <option value="svg">SVG</option>
                <option value="pdf">PDF</option>
              </select>
              <button id="btnDownload" class="btn">Download</button>
            </div>

            <p id="hint" style="color:#f7d7d7;margin:.6rem 0 0;display:none;text-align:center"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">© <span id="year">2025</span> riyst.com</div>
  </footer>

  <script>
    (function(){const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();})();

    const mount = document.getElementById('mount');
    const fmt = document.getElementById('fmt');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnDownload = document.getElementById('btnDownload');
    const hint = document.getElementById('hint');
    const previewWrapper = document.getElementById('previewWrapper');
    const downloads = document.getElementById('downloads');
    const nameField = document.getElementById('nameField');
    const locField = document.getElementById('locField');
    const itemField = document.getElementById('itemField');

    let lastSVG = null;
    let lastCanvas = null;
    let lastValue = "";
    let lastWidth = 0, lastHeight = 0;

    function showError(msg){
      hint.textContent = msg || "";
      hint.style.display = msg ? "block" : "none";
    }
    function clearPreview(){
      mount.innerHTML = "";
      lastSVG = null;
      lastCanvas = null;
      lastWidth = 0; lastHeight = 0;
    }

    function buildDescriptor(){
      const parts = [nameField.value.trim(), locField.value.trim(), itemField.value.trim()].filter(Boolean);
      return parts.join(" • ");
    }

    // Code 39 map
    const CODE39 = {
      "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
      "A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
      "K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
      "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn",
      "*":"nwnnwnwnn"
    };

    function generateValue(len=12){
      let s=""; for(let i=0;i<len;i++){ s += Math.floor(Math.random()*10); }
      return s;
    }

    function renderCode39(value){
      clearPreview();
      showError("");

      const text = "*" + value + "*";

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      const narrow = 2;
      const wide   = narrow * 3;
      const quiet  = 10;
      const barTop = 24;
      const barH   = 180;

      let x = quiet;
      const g = document.createElementNS(svgNS, "g");

      function drawPattern(pattern){
        for(let i=0;i<pattern.length;i++){
          const isBar = (i % 2 === 0);
          const w = pattern[i] === "n" ? narrow : wide;
          if(isBar){
            const rect = document.createElementNS(svgNS, "rect");
            rect.setAttribute("x", x);
            rect.setAttribute("y", barTop);
            rect.setAttribute("width", w);
            rect.setAttribute("height", barH);
            rect.setAttribute("fill", "#000");
            g.appendChild(rect);
          }
          x += w;
        }
        x += narrow;
      }

      for(const ch of text){
        const pat = CODE39[ch];
        if(!pat){ showError("Unsupported character: " + ch); return; }
        drawPattern(pat);
      }

      // Human readable number
      const t = document.createElementNS(svgNS, "text");
      const numY = barTop + barH + 28;
      t.setAttribute("x", 0);
      t.setAttribute("y", numY);
      t.setAttribute("font-size", "20");
      t.setAttribute("font-weight", "800");
      t.setAttribute("fill", "#111");
      t.textContent = value;
      g.appendChild(t);

      // Optional descriptor line
      const desc = buildDescriptor();
      let descHeight = 0;
      if(desc){
        const d = document.createElementNS(svgNS, "text");
        d.setAttribute("x", 0);
        d.setAttribute("y", numY + 22);
        d.setAttribute("font-size", "14");
        d.setAttribute("font-weight", "700");
        d.setAttribute("fill", "#333");
        d.textContent = desc;
        g.appendChild(d);
        descHeight = 22;
      }

      const contentW = x + quiet;
      const width = contentW;
      const height = barTop + barH + 48 + descHeight;
      // center text
      t.setAttribute("x", width/2);
      t.setAttribute("text-anchor", "middle");
      if(desc){
        const d = g.lastChild; // descriptor text
        d.setAttribute("x", width/2);
        d.setAttribute("text-anchor", "middle");
      }

      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.style.background = "#ffffff";
      svg.appendChild(g);

      mount.appendChild(svg);
      lastSVG = svg;
      lastValue = value;
      lastWidth = width;
      lastHeight = height;

      // Reveal preview + downloads and center them
      previewWrapper.style.display = "block";
      previewWrapper.style.minHeight = (height + 16) + "px";
      previewWrapper.style.width = (width + 16) + "px";
      previewWrapper.style.maxWidth = "100%";
      previewWrapper.style.margin = "var(--stack-gap) auto 0 auto";
      previewWrapper.setAttribute("aria-hidden","false");
      downloads.style.display = "flex";
      downloads.style.marginTop = "var(--stack-gap)";
    }

    function svgToPngBlob(svgEl, outW, outH){
      outW = outW || parseInt(svgEl.getAttribute("width"),10) || 800;
      outH = outH || parseInt(svgEl.getAttribute("height"),10) || 260;
      return new Promise((resolve, reject) => {
        const xml = new XMLSerializer().serializeToString(svgEl);
        const svg64 = btoa(unescape(encodeURIComponent(xml)));
        const image64 = 'data:image/svg+xml;base64,' + svg64;
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(img,0,0,outW,outH);
          canvas.toBlob(b => resolve(b), 'image/png');
          lastCanvas = canvas;
        };
        img.onerror = reject;
        img.src = image64;
      });
    }

    async function canvasToPdfBlob(canvas){
      const dataURL = canvas.toDataURL('image/jpeg', 0.95);
      const b64 = dataURL.split(',')[1];
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const w = canvas.width, h = canvas.height;
      const pdfW = w, pdfH = h;

      function str2buf(s){ return Uint8Array.from(s, c=>c.charCodeAt(0)); }
      function concat(...arrays){
        let len = arrays.reduce((a,b)=>a+b.length,0);
        let out = new Uint8Array(len);
        let off = 0;
        for(const arr of arrays){ out.set(arr, off); off += arr.length; }
        return out;
      }

      const header = str2buf('%PDF-1.4\n');
      const objs = [];
      const xref = [];
      let offset = header.length;

      function addObject(s, bin){
        const head = str2buf(s);
        const body = bin ? bin : new Uint8Array();
        const end = str2buf('\nendobj\n');
        const chunk = concat(head, body, end);
        const start = offset;
        offset += chunk.length;
        objs.push(chunk);
        xref.push(start);
      }

      addObject('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
      addObject(`2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n`);
      addObject(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pdfW} ${pdfH}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>\nendobj\n`);
      const imgDict = `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`;
      addObject(imgDict, concat(bytes, str2buf('\nendstream')));
      const content = `q\n${pdfW} 0 0 ${pdfH} 0 0 cm\n/Im0 Do\nQ\n`;
      const contentBytes = str2buf(content);
      addObject(`5 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`, concat(contentBytes, str2buf('\nendstream')));

      let xrefStr = 'xref\n0 ' + (xref.length + 1) + '\n';
      xrefStr += '0000000000 65535 f \n';
      for(const off of xref){
        xrefStr += off.toString().padStart(10,'0') + ' 00000 n \n';
      }
      const xrefBuf = str2buf(xrefStr);
      const trailer = str2buf(`trailer\n<< /Size ${xref.length + 1} /Root 1 0 R >>\nstartxref\n${offset}\n%%EOF`);
      const full = concat(header, ...objs, xrefBuf, trailer);
      return new Blob([full], {type:'application/pdf'});
    }

    function download(name, blob){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 250);
    }

    btnGenerate.addEventListener('click', ()=>{
      const v = generateValue(12);
      renderCode39(v);
    });

    btnDownload.addEventListener('click', async ()=>{
      if(!lastSVG){ return; }
      const ext = fmt.value;
      if(ext === "svg"){
        const xml = new XMLSerializer().serializeToString(lastSVG);
        const blob = new Blob([xml], {type:'image/svg+xml'});
        download('barcode.svg', blob);
      }else if(ext === "png"){
        const pngBlob = await svgToPngBlob(lastSVG, lastWidth, lastHeight);
        download('barcode.png', pngBlob);
      }else if(ext === "pdf"){
        const pngBlob = await svgToPngBlob(lastSVG, lastWidth, lastHeight);
        const canvas = document.createElement('canvas');
        canvas.width = lastWidth;
        canvas.height = lastHeight;
        const ctx = canvas.getContext('2d');
        const url = URL.createObjectURL(pngBlob);
        const i = new Image();
        await new Promise((res, rej)=>{
          i.onload = ()=>{ ctx.drawImage(i,0,0); URL.revokeObjectURL(url); res(); };
          i.onerror = rej;
          i.src = url;
        });
        const pdfBlob = await canvasToPdfBlob(canvas);
        download('barcode.pdf', pdfBlob);
      }
    });
  </script>
</body>
