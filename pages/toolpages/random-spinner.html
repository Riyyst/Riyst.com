<!-- Style -->
  <style>
    :root{
      --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --max-w:1100px; --ctl-h:46px; --gap:14px; --radius:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial}
    a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:1rem 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent}
    .nav__link:hover{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);text-decoration:none}
    .nav__link--highlight{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}

    .intro{text-align:center;padding:clamp(2rem,6vw,4rem) 0 1.5rem;background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title{margin:.2rem auto .4rem auto;line-height:1.02;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:1000;text-transform:uppercase}
    .intro__subtitle{margin:0 auto;color:var(--muted);font-weight:800}

    .tool{padding:2.2rem 0 4rem}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
          border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.45);
          padding:1.2rem;max-width:980px;margin:0 auto}
    .grid{display:grid;gap:1rem;grid-template-columns:420px 1fr;align-items:start}
    @media (max-width:980px){.grid{grid-template-columns:1fr}}

    label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:.35rem}
    input[type="text"], input[type="number"]{
      height:var(--ctl-h);width:100%;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.07);color:#e7e6ff;outline:none;appearance:none
    }
    input[type="number"]{max-width:120px}
    input::placeholder{color:#cbd0ddaa}
    .panel{background:#121219;border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:14px}
    .panel.wheel-panel{padding-bottom:10px}

    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row.center{justify-content:center}
    .row.stretch > input[type="text"]{flex:1}
    .actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:12px;margin-bottom:6px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.7rem 1.15rem;border-radius:999px;border:1px solid transparent;
         background:rgba(255,255,255,.07);color:#e7e6ff;border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:900;transition:transform .08s ease}
    .btn.small{padding:.5rem 1rem}
    .btn:hover{animation:pulse 1.2s ease-in-out infinite;text-decoration:none}
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.55;cursor:not-allowed;animation:none}
    .btn.primary{background:linear-gradient(135deg,#7aa2ff,#b18bff);color:#0e061d;border-color:transparent}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18)}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,92,246,.4)}70%{box-shadow:0 0 0 12px rgba(139,92,246,0)}100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}}

    .items{display:flex;flex-direction:column;gap:10px}
    .item{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center}
    .item input[type="text"]{width:100%}
    .color-dot{width:22px;height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.22)}
    .item .remove{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);cursor:pointer}
    .item .remove:hover{background:rgba(255,255,255,.12)}

    .wheel-wrap{position:relative;aspect-ratio:1/1;max-width:560px;margin:0 auto;background:transparent;display:grid;place-items:center;overflow:hidden}
    canvas#wheel{width:100%;height:100%;position:relative;z-index:1;background:transparent}
    .pin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:3;
         border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #ffffff;
         filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
    .wheel{transition:transform 5s cubic-bezier(.2,.8,.1,1);will-change:transform}

    /* Winner pop-up centered */
    .wheel-winner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
      font-weight:1000; text-transform:uppercase; padding:.45rem 1rem; border-radius:999px;
      background:rgba(255,255,255,.95); color:#0b0b0e; box-shadow:0 6px 18px rgba(0,0,0,.35); pointer-events:none;
      opacity:0; transition:opacity .15s ease; font-size:1.25rem; letter-spacing:.5px}
    .wheel-winner.show{opacity:1}
    @keyframes popPulse{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.35)}60%{transform:translate(-50%,-50%) scale(0.92)}100%{transform:translate(-50%,-50%) scale(1)}}
    .wheel-winner.pulse{animation:popPulse .8s ease both}

    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
    .piece{position:absolute;var(--top:-15vh);top:var(--top);width:10px;height:14px;opacity:0;border-radius:2px;animation:fall var(--dur,3.6s) linear forwards}
    @keyframes fall{ 0%{transform:translateY(0) rotate(0deg); opacity:0} 5%{opacity:1} 100%{transform:translateY(130vh) rotate(720deg); opacity:1} }

    footer.site-footer{padding:0.75rem 0 1.25rem;border-top:1px solid rgba(255,255,255,.06);color:var(--muted);text-align:center}
  
    /* Skip link */
    .skip-link{
      position:absolute;
      left:var(--space-4);
      top:var(--space-4);
      background:#000;
      color:#fff;
      padding:.5rem .75rem;
      border-radius:999px;
      transform:translateY(-200%);
      transition:transform var(--dur) var(--ease);
      z-index:100;
    }
    .skip-link:focus{
      transform:none;
    }

    /* Footer */
    .fine{
      font-size:.95rem;
      color:var(--muted);
    }
    footer.site-footer{
      padding:0.75rem 0 1.25rem;
      border-top:1px solid rgba(255,255,255,.08);
      color:var(--muted);
    }
    .footer-legal{
      margin-top:var(--space-2);
      display:flex;
      justify-content:center;
      gap:var(--space-3);
      font-size:.85rem;
    }
    .footer-legal a{
      color:var(--accent);
    }
    .footer-legal a:hover{
      text-decoration:underline;
    }

    /* Layout: sticky footer */
    html, body { min-height: 100%; }
    body { display:flex; flex-direction:column; }
    main { flex:1; }
    .site-footer { margin-top:auto; }

</style>

  <main id="main">

    <section class="tool">

              <div class="row stretch">
                <label class="sr-only" for="newText">Add option</label>
                <input id="newText" type="text" placeholder="Add option e.g., Pizza" />
                <button id="addBtn" class="btn primary">Add</button>

                <button id="saveBtn" class="btn ghost">Save list</button>

  <script>
  (function(){
    const itemsEl = document.getElementById('items');
    const wheelCanvas = document.getElementById('wheel');
    const ctx = wheelCanvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const addBtn = document.getElementById('addBtn');
    const newTextEl = document.getElementById('newText');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const confettiBox = document.getElementById('confetti');
    const wheelWinner = document.getElementById('wheelWinner');

    const SELECTOR_DEG = -90;

    const Y = document.getElementById('y'); Y.textContent = new Date().getFullYear();

    let items = [];
    let rotation = 0;
    let spinning = false;
    let hideWinnerTimer = null;

    const randomColor = (i, n) => `hsl(${((i/n)*360 + (n*11.8)) % 360} 82% 60%)`;

    function ensureColors(){ const n=items.length||1; items.forEach((it,i)=> it.color=randomColor(i,n)); }

    function addItem(text, weight=1){
      const id = crypto.randomUUID();
      items.push({ id, text: String(text).trim(), weight: Math.max(1, Number(weight)||1), color: '#7aa2ff' });
      ensureColors(); renderItems(); drawWheel();
    }

    function removeItem(id){ items = items.filter(i=>i.id!==id); ensureColors(); renderItems(); drawWheel(); }

    function renderItems(){
      itemsEl.innerHTML = '';
      items.forEach((it)=>{
        const row = document.createElement('div'); row.className='item';
        row.style.border='1px solid rgba(255,255,255,.12)'; row.style.borderRadius='12px'; row.style.padding='8px';
        const name=document.createElement('input'); name.type='text'; name.value=it.text; name.placeholder='Label'; name.addEventListener('input',e=>{it.text=e.target.value; drawWheel();});
        const weight=document.createElement('input'); weight.type='number'; weight.min='1'; weight.step='1'; weight.value=it.weight; weight.title='Weight'; weight.addEventListener('input',e=>{it.weight=Math.max(1, Math.floor(e.target.value||1)); drawWheel();});
        const rm=document.createElement('button'); rm.className='remove'; rm.title='Remove'; rm.innerHTML='✕'; rm.addEventListener('click',()=>removeItem(it.id));
        const right=document.createElement('div'); right.style.display='flex'; right.style.alignItems='center'; right.style.gap='8px';
        const dot=document.createElement('div'); dot.className='color-dot'; dot.style.background=it.color; right.append(dot, rm);
        const label=document.createElement('small'); label.style.gridColumn='1 / -1'; label.style.color='var(--muted)'; label.style.marginTop='-4px'; label.textContent='Weight';
        row.append(name, weight, right); row.insertBefore(label, right); itemsEl.appendChild(row);
      });
    }

    function distributeEvenly(counts){
      const N = counts.reduce((a,b)=>a+b,0);
      const seq = new Array(N).fill(null);
      let pointer = 0;
      for(let idx=0; idx<counts.length; idx++){
        const c = counts[idx]; if(c<=0) continue;
        const step = N / c; let pos = (pointer + idx) % N;
        for(let j=0;j<c;j++){
          let k = Math.floor(pos) % N, startK=k;
          while(seq[k] !== null){ k=(k+1)%N; if(k===startK) break; }
          seq[k] = idx; pos += step;
        }
        pointer = (pointer + Math.floor(step/2)) % N;
      }
      return seq.map(i=>items[i]);
    }

    function effectivePool(){
      if(!items.length) return [];
      const counts = items.map(it=>Math.max(1, Math.floor(it.weight||1)));
      return distributeEvenly(counts);
    }

    function drawWheel(){
      const W = wheelCanvas.width, H = wheelCanvas.height;
      const cx=W/2, cy=H/2, r=Math.min(cx,cy)-10;
      const pool = effectivePool();
      const n = pool.length;
      ctx.clearRect(0,0,W,H);

      if(!n){
        // blank grey wheel
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#2a2d36'; ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy,36,0,Math.PI*2); ctx.fillStyle='#0b0b0e'; ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.stroke();
        return;
      }

      const slice = (Math.PI*2)/n;
      const base = -Math.PI/2 - slice/2; // first slice centered at top
      for(let i=0;i<n;i++){
        const s = base + i*slice, e = s + slice;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,e); ctx.closePath();
        const idx = items.findIndex(x=>x.id===pool[i].id);
        ctx.fillStyle = items[idx]?.color || '#7aa2ff'; ctx.fill();

        const mid = (s+e)/2;
        ctx.save();
        ctx.translate(cx + Math.cos(mid)*r*0.62, cy + Math.sin(mid)*r*0.62);
        ctx.rotate(mid + Math.PI/2);
        ctx.fillStyle = '#0b0b0e';
        ctx.font = '700 24px system-ui';
        const t = (pool[i].text||'').toString().slice(0,18);
        ctx.fillText(t, -ctx.measureText(t).width/2, 0);
        ctx.restore();
      }

      ctx.beginPath(); ctx.arc(cx,cy,36,0,Math.PI*2); ctx.fillStyle='#0b0b0e'; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.stroke();
    }

    // Stronger stagger: longer spawn window + easing ramp + varied start height
    function confettiProgressiveStronger(totalPieces=560, spawnWindowMs=2000){
      confettiBox.innerHTML='';
      const colors=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6'];
      const W=confettiBox.clientWidth||600;
      const start=performance.now();
      let created=0;

      const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

      function frame(t){
        const elapsed = t - start;
        const x = Math.min(1, elapsed / spawnWindowMs);
        const targetCount = Math.floor(easeOutCubic(x) * totalPieces);

        while(created < targetCount){
          const p=document.createElement('div');
          p.className='piece';
          p.style.background=colors[created % colors.length];
          p.style.left=(Math.random()*W)+'px';
          // varied start height between -12vh and -28vh
          const topvh = -12 - Math.random()*16;
          p.style.top = topvh + 'vh';
          // varied duration (3.2–4.2s) for more spread
          const dur = 3.2 + Math.random()*1.0;
          p.style.setProperty('--dur', dur+'s');
          p.style.width=(8+Math.random()*8)+'px';
          p.style.height=(10+Math.random()*10)+'px';
          confettiBox.appendChild(p);
          created++;
        }

        if(x < 1){ requestAnimationFrame(frame); }
      }
      requestAnimationFrame(frame);

      setTimeout(()=>confettiBox.innerHTML='', spawnWindowMs + 4600);
    }

    function mod(a,n){ return ((a%n)+n)%n; }

    function spin(){
      if(spinning || !items.length) return;
      if(hideWinnerTimer){ clearTimeout(hideWinnerTimer); hideWinnerTimer = null; }
      wheelWinner.textContent='';
      wheelWinner.classList.remove('show','pulse');
      confettiBox.innerHTML='';

      const pool = effectivePool(), n = pool.length, slice = 360/n;
      const idx = Math.floor(Math.random()*n);
      const winner = pool[idx];

      // Align chosen slice center to pin tip (-90°)
      const theta_i = -90 + idx*slice;
      const pxAngle = 360 / (Math.PI * (wheelCanvas.width/2));
      const margin = pxAngle * 1.0;
      const jitter = (Math.random()*2 - 1) * (slice/2 - margin);
      const alpha = -90 + jitter;

      const currentNorm = mod(rotation, 360);
      const extraSpins = 8, duration = 5;
      const delta = 360*extraSpins + (alpha - theta_i) - currentNorm;
      rotation += delta;

      spinning = true;
      wheelCanvas.style.transition = `transform ${duration}s cubic-bezier(.2,.8,.1,1)`;
      requestAnimationFrame(()=>{ wheelCanvas.style.transform = `rotate(${rotation}deg)`; });

      setTimeout(()=>{
        spinning = false;

        // Winner pop-up (auto-hide after ~3.4s)
        wheelWinner.textContent = winner.text;
        wheelWinner.classList.remove('pulse'); void wheelWinner.offsetWidth;
        wheelWinner.classList.add('show','pulse');
        hideWinnerTimer = setTimeout(()=>{ wheelWinner.classList.remove('show'); }, 3400);

        // Start stronger staggered confetti
        confettiProgressiveStronger(560, 2000);

        try{ navigator.vibrate && navigator.vibrate(60); }catch{}
      }, duration*1000 + 30);
    }

    addBtn.onclick=()=>{const v=newTextEl.value.trim(); if(!v) return; addItem(v); newTextEl.value=''; newTextEl.focus();};
    newTextEl.onkeydown=e=>{if(e.key==='Enter') addBtn.click();};
    clearBtn.onclick=()=>{items=[]; renderItems(); drawWheel(); wheelWinner.textContent=''; wheelWinner.classList.remove('show','pulse'); confettiBox.innerHTML=''; if(hideWinnerTimer){clearTimeout(hideWinnerTimer);hideWinnerTimer=null;} };
    saveBtn.onclick=()=>{localStorage.setItem('spinner:list', JSON.stringify(items.map(({text,weight})=>({text,weight}))));};
    loadBtn.onclick=()=>{try{const d=JSON.parse(localStorage.getItem('spinner:list')||'[]'); items=[]; d.forEach(x=>items.push({id:crypto.randomUUID(), text:x.text, weight:x.weight||1, color:'#7aa2ff'})); ensureColors(); renderItems(); drawWheel(); }catch{}};

    ensureColors(); renderItems(); drawWheel();
    spinBtn.onclick = spin;
  })();
  </script>
