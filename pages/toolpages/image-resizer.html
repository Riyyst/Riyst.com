<!-- Style -->
  <style>
    :root{
      --bg:#0b0b0e; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --max-w:1100px; --ctl-h:46px; --gap:14px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial}
    a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}

    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:1rem 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent}
    .nav__link:hover{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);text-decoration:none}
    .nav__link--highlight{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
    footer.site-footer{padding:0.75rem 0 1.25rem;border-top:1px solid rgba(255,255,255,.06)}

    /* ===== Tool ===== */
    .intro{position:relative;text-align:center;padding:clamp(2rem,6vw,4rem) 0 1.5rem;background:linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title{margin:.2rem auto .4rem auto;line-height:1.02;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:1000;letter-spacing:.4px}
    .intro__subtitle{margin:0 auto;color:var(--muted);font-weight:800}

    .tool{padding:2.5rem 0 4rem}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
          border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);
          padding:2rem;max-width:980px;margin:0 auto}
    .row{display:flex;justify-content:center;gap:var(--gap);flex-wrap:wrap;margin-top:var(--gap)}
    .col{min-width:230px;max-width:320px;flex:1 1 260px}
    .full{max-width:680px;flex:1 1 520px}
    label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.4rem}
    input[type="number"], input[type="text"], select{
      height:var(--ctl-h);width:100%;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.07);color:var(--text);outline:none;appearance:none
    }
    input::placeholder{color:#cbd0ddaa}

    .file-input{position:relative;height:var(--ctl-h)}
    .file-input input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
    .file-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.6rem;
              border-radius:12px;border:1px solid rgba(255,255,255,.18);
              background:linear-gradient(135deg,#7aa2ff,#b18bff);color:#0e061d;font-weight:900;
              box-shadow:0 6px 18px rgba(139,92,246,.35)}
    .filename{text-align:center;color:var(--muted);font-size:.8rem;margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .seg{display:flex;gap:8px;padding:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);
         border-radius:12px;height:var(--ctl-h);align-items:center}
    .seg input{display:none}
    .seg label{flex:1;display:flex;align-items:center;justify-content:center;height:100%;border-radius:10px;font-weight:800;color:#e7e6ff}
    .seg input:checked + label{background:linear-gradient(135deg,#7aa2ff,#b18bff);color:#0e061d;box-shadow:0 6px 14px rgba(139,92,246,.35)}

    .color-wrap{display:flex;gap:10px;align-items:center}
    .chip{width:var(--ctl-h);height:var(--ctl-h);border-radius:12px;border:1px solid rgba(255,255,255,.18);overflow:hidden;background:rgba(255,255,255,.07)}
    .chip input[type="color"]{appearance:none;-webkit-appearance:none;border:none;margin:0;padding:0;width:100%;height:100%;cursor:pointer}
    .chip input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
    .chip input[type="color"]::-webkit-color-swatch{border:none}

    .canvas{margin-top:1.25rem;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.12);
            background:#0a0f1a;display:flex;justify-content:center}
    #canvas{display:block}

    .actions{display:flex;justify-content:center;margin-top:1.25rem}
    .btn{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.1rem;border-radius:999px;border:1px solid transparent;
         background:var(--accent);color:#0e061d;font-weight:900;box-shadow:0 10px 25px rgba(139,92,246,.35);
         transition:transform .08s ease}
    .btn:hover{animation:pulse 1.3s ease-in-out infinite}
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;animation:none}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(139,92,246,.4)}
      70%{box-shadow:0 0 0 12px rgba(139,92,246,0)}
      100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}
    }
  
    /* Skip link */
    .skip-link{
      position:absolute;
      left:var(--space-4);
      top:var(--space-4);
      background:#000;
      color:#fff;
      padding:.5rem .75rem;
      border-radius:999px;
      transform:translateY(-200%);
      transition:transform var(--dur) var(--ease);
      z-index:100;
    }
    .skip-link:focus{
      transform:none;
    }

    /* Footer */
    .fine{
      font-size:.95rem;
      color:var(--muted);
    }
    footer.site-footer{
      padding:0.75rem 0 1.25rem;
      border-top:1px solid rgba(255,255,255,.08);
      color:var(--muted);
    }
    .footer-legal{
      margin-top:var(--space-2);
      display:flex;
      justify-content:center;
      gap:var(--space-3);
      font-size:.85rem;
    }
    .footer-legal a{
      color:var(--accent);
    }
    .footer-legal a:hover{
      text-decoration:underline;
    }

    /* Layout: sticky footer */
    html, body { min-height: 100%; }
    body { display:flex; flex-direction:column; }
    main { flex:1; }
    .site-footer { margin-top:auto; }

</style>

<body>

  <!-- ===== Page content ===== -->
  <main id="main">
    <section class="intro">
      <div class="container">
        <h1 class="intro__title">Image Resizer</h1>
        <p class="intro__subtitle">Resize - just how you want</p>
      </div>
    </section>

    <section class="tool">
      <div class="container">
        <div class="card">
          <!-- Row 1 -->
          <div class="row">
            <div class="col full">
              <div class="file-input">
                <button type="button" class="file-btn" id="fileBtn">Choose Image</button>
                <input type="file" id="file" accept="image/*" />
              </div>
              <div class="filename" id="filename">No file selected</div>
            </div>
          </div>
          <!-- Row 2 -->
          <div class="row">
            <div class="col">
              <label for="w">Width (px)</label>
              <input type="number" id="w" placeholder="e.g. 820" min="1" />
            </div>
            <div class="col">
              <label for="h">Height (px)</label>
              <input type="number" id="h" placeholder="e.g. 312" min="1" />
            </div>
          </div>
          <!-- Row 3 (Fit) -->
          <div class="row" id="rowFit">
            <div class="col">
              <label>Mode</label>
              <div class="seg" role="radiogroup" aria-label="Resize mode">
                <input type="radio" id="m-fit" name="mode" value="fit" checked /><label for="m-fit">Fit</label>
                <input type="radio" id="m-fill" name="mode" value="fill" /><label for="m-fill">Fill</label>
              </div>
            </div>
            <div class="col">
              <label>Padding color</label>
              <div class="color-wrap">
                <div class="chip"><input type="color" id="bg" value="#000000" /></div>
                <input type="text" id="bgHex" value="#000000" placeholder="#RRGGBB" />
              </div>
            </div>
            <div class="col">
              <label for="format">Format</label>
              <select id="format">
                <option value="png" selected>PNG</option>
                <option value="jpg">JPG</option>
              </select>
            </div>
          </div>
          <!-- Row 3 (Fill) -->
          <div class="row" id="rowFill" style="display:none">
            <div class="col">
              <label>Mode</label>
              <div class="seg" role="radiogroup" aria-label="Resize mode">
                <input type="radio" id="m-fit2" name="mode2" value="fit" /><label for="m-fit2">Fit</label>
                <input type="radio" id="m-fill2" name="mode2" value="fill" checked /><label for="m-fill2">Fill</label>
              </div>
            </div>
            <div class="col">
              <label for="align">Alignment (Fill)</label>
              <select id="align">
                <option value="center">Center</option>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="top-left">Top-Left</option>
                <option value="top-right">Top-Right</option>
                <option value="bottom-left">Bottom-Left</option>
                <option value="bottom-right">Bottom-Right</option>
              </select>
            </div>
            <div class="col">
              <label for="format2">Format</label>
              <select id="format2">
                <option value="png" selected>PNG</option>
                <option value="jpg">JPG</option>
              </select>
            </div>
          </div>

          <!-- Preview -->
          <div class="canvas" id="canvasWrap">
            <canvas id="canvas"></canvas>
            <canvas id="exportCanvas" style="display:none"></canvas>
          </div>

          <!-- Actions -->
          <div class="actions">
            <button id="download" class="btn" disabled>Download</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo" >
    <div class="container" style="text-align:center; position:relative;">
      <p class="fine" style="margin:0">
        &copy; <span id="year">2025</span> riyst.com
      </p>
      <div class="footer-legal">
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
        <a href="https://buymeacoffee.com/riyst">Support/Donate</a>
      </div>
    </div>
  </footer>

  <script>
    // Footer year
    (function(){const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();})();

    // Elements
    const fileEl = document.getElementById('file');
    const fileBtn = document.getElementById('fileBtn');
    const filenameEl = document.getElementById('filename');
    const wEl = document.getElementById('w');
    const hEl = document.getElementById('h');

    const rowFit = document.getElementById('rowFit');
    const rowFill = document.getElementById('rowFill');
    const fitRadio = document.getElementById('m-fit');
    const fillRadio = document.getElementById('m-fill');
    const fitRadio2 = document.getElementById('m-fit2');
    const fillRadio2 = document.getElementById('m-fill2');

    const bgEl = document.getElementById('bg');
    const bgHexEl = document.getElementById('bgHex');
    const formatEl = document.getElementById('format');
    const formatEl2 = document.getElementById('format2');
    const alignEl = document.getElementById('align');

    const downloadBtn = document.getElementById('download');
    const previewCanvas = document.getElementById('canvas');
    const exportCanvas = document.getElementById('exportCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const exportCtx = exportCanvas.getContext('2d');
    const canvasWrap = document.getElementById('canvasWrap');

    let img = null;
    let originalBase = 'image';
    let mode = 'fit';

    // File
    fileBtn.addEventListener('click', ()=> fileEl.click());
    fileEl.addEventListener('change', async ()=>{
      const f = fileEl.files?.[0];
      if(!f) return;
      filenameEl.textContent = f.name;
      originalBase = f.name.replace(/\.[^.]+$/,'') || 'image';
      img = await readImage(f);
      render();
    });

    function readImage(f){
      return new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = e => { const im = new Image(); im.onload = ()=>resolve(im); im.onerror = ()=>reject(new Error('Load error')); im.src = e.target.result; };
        r.onerror = ()=>reject(new Error('Read error'));
        r.readAsDataURL(f);
      });
    }

    function dimsOK(){
      const tw = parseInt(wEl.value,10);
      const th = parseInt(hEl.value,10);
      return Number.isFinite(tw)&&tw>0 && Number.isFinite(th)&&th>0 ? [tw,th] : null;
    }

    function setMode(m){
      mode = m;
      fitRadio.checked = m==='fit'; fillRadio.checked = m==='fill';
      fitRadio2.checked = m==='fit'; fillRadio2.checked = m==='fill';
      rowFit.style.display = m==='fit' ? '' : 'none';
      rowFill.style.display = m==='fill' ? '' : 'none';
      render();
    }
    fitRadio.addEventListener('change', ()=>setMode('fit'));
    fillRadio.addEventListener('change', ()=>setMode('fill'));
    fitRadio2.addEventListener('change', ()=>setMode('fit'));
    fillRadio2.addEventListener('change', ()=>setMode('fill'));

    const normHex = v => { v=(v||'').trim(); if(!v.startsWith('#')) v='#'+v; return /^#([0-9a-fA-F]{6})$/.test(v)?v.toUpperCase():null; };
    bgEl.addEventListener('input', ()=>{ bgHexEl.value = bgEl.value.toUpperCase(); render(); });
    bgHexEl.addEventListener('input', ()=>{ const v=normHex(bgHexEl.value); if(v) bgEl.value=v; render(); });

    [wEl,hEl,alignEl,formatEl,formatEl2].forEach(el=>{
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    
    // Detect if current image contains any transparent pixels (sampling for performance)
    function __hasAlpha(im){
      try{
        const sw = im.naturalWidth || im.width;
        const sh = im.naturalHeight || im.height;
        if(!sw || !sh) return false;
        const maxSamples = 64000;
        const scale = Math.min(1, Math.sqrt(maxSamples / (sw*sh)));
        const cw = Math.max(1, Math.floor(sw * scale));
        const ch = Math.max(1, Math.floor(sh * scale));
        const c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        const cctx = c.getContext('2d');
        cctx.clearRect(0,0,cw,ch); // preserve alpha
        cctx.drawImage(im, 0,0, sw,sh, 0,0, cw,ch);
        const data = cctx.getImageData(0,0,cw,ch).data;
        for(let i=3;i<data.length;i+=4){ if(data[i] < 255){ return true; } }
      }catch(e){ /* cross-origin or other error; assume no alpha to avoid surprise */ }
      return false;
    }

    function render(){
      const d = dimsOK();
      if(!img || !d){
        previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
        downloadBtn.disabled = true;
        return;
      }

      const [tw,th] = d;

      // Draw exact output
      exportCanvas.width = tw; exportCanvas.height = th;
      const sw = img.naturalWidth || img.width;
      const sh = img.naturalHeight || img.height;

      exportCtx.save();
      exportCtx.imageSmoothingEnabled = true;
      exportCtx.imageSmoothingQuality = 'high';

      if(mode==='fit'){
        const scale = Math.min(tw/sw, th/sh);
        const dw = Math.round(sw*scale), dh = Math.round(sh*scale);
        const dx = Math.floor((tw-dw)/2), dy = Math.floor((th-dh)/2);
        const fmt = (mode==='fit'?formatEl.value:formatEl2.value);
        const __imgHasAlpha = __hasAlpha(img);
        if(!(fmt==='png' && __imgHasAlpha)){
          exportCtx.fillStyle = bgEl.value;
          exportCtx.fillRect(0,0,tw,th);
        }else{
          exportCtx.clearRect(0,0,tw,th); // keep full transparency when exporting transparent PNGs
        }
        exportCtx.drawImage(img,0,0,sw,sh,dx,dy,dw,dh);
      }else{
        const scale = Math.max(tw/sw, th/sh);
        const dw = Math.round(sw*scale), dh = Math.round(sh*scale);
        let dx = Math.floor((tw-dw)/2), dy = Math.floor((th-dh)/2);
        const a = alignEl.value;
        if(a?.includes('left')) dx = 0;
        if(a?.includes('right')) dx = tw - dw;
        if(a?.includes('top')) dy = 0;
        if(a?.includes('bottom')) dy = th - dh;
        exportCtx.clearRect(0,0,tw,th);
        exportCtx.drawImage(img,dx,dy,dw,dh);
      }
      exportCtx.restore();

      // HiDPI preview
      const available = canvasWrap.clientWidth;
      const cssW = Math.min(available, tw);
      const scale = cssW / tw;
      const dpr = window.devicePixelRatio || 1;

      previewCanvas.style.width = cssW + 'px';
      previewCanvas.style.height = Math.round(th * scale) + 'px';
      previewCanvas.width = Math.round(cssW * dpr);
      previewCanvas.height = Math.round(th * scale * dpr);

      previewCtx.save();
      previewCtx.imageSmoothingEnabled = true;
      previewCtx.imageSmoothingQuality = 'high';
      previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
      previewCtx.drawImage(exportCanvas, 0,0, tw,th, 0,0, previewCanvas.width, previewCanvas.height);
      previewCtx.restore();

      downloadBtn.disabled = false;
    }

    // Download
    downloadBtn.addEventListener('click', ()=>{
      const d = dimsOK(); if(!d) return;
      const [tw,th] = d;
      const fmt = (mode==='fit'?formatEl.value:formatEl2.value);
      const name = `${originalBase}_resized_${tw}x${th}.${fmt}`;
      const mime = (fmt==='png') ? 'image/png' : 'image/jpeg';
      const quality = (fmt==='png') ? undefined : 0.92;

      exportCanvas.toBlob(blob=>{
        if(!blob){
          const dataURL = exportCanvas.toDataURL(mime, quality);
          triggerDownload(name, dataURL);
          return;
        }
        const url = URL.createObjectURL(blob);
        triggerDownload(name, url, true);
      }, mime, quality);

      function triggerDownload(filename, href, revoke=false){
        const a = document.createElement('a');
        a.download = filename; a.href = href; document.body.appendChild(a); a.click(); a.remove();
        if(revoke) setTimeout(()=>URL.revokeObjectURL(href), 1000);
      }
    });

    // Keep preview crisp on resize
    window.addEventListener('resize', ()=>{ clearTimeout(window.__rt); window.__rt = setTimeout(render, 120); });

    // Init
    setMode('fit');
  </script>
</body>
