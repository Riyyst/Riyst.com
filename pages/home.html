<!-- Style -->
  <style>
    :root{
      --bg:#0b0b0e; --panel:#121219; --text:#f6f7fb; --muted:#a6abbb; --accent:#8b5cf6;
      --space-0:0; --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem;
      --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem; --space-16:4rem; --space-20:5rem;
      --r-1:.375rem; --r-2:.75rem; --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45);
      --dur-fast:.15s; --dur:.25s; --dur-slow:.5s; --ease:cubic-bezier(.2,.7,.2,1);
      --font:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol;
      --max-w:1100px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;height:auto;display:block}

    .container{width:min(var(--max-w),100% - 2rem);margin-inline:auto}
    .stack{display:flex;flex-direction:column}
    .stack>*+*{margin-top:var(--space-4)}
    .btn{--btn-bg:transparent;--btn-text:var(--text);--btn-border:rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:.6rem;padding:.85rem 1.1rem;border-radius:999px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);font-weight:800;transition:transform var(--dur) var(--ease), background var(--dur), border-color var(--dur);outline-offset:3px}
    .btn:hover{transform:translateY(-1px);text-decoration:none}
    .btn--primary{--btn-bg:var(--accent);--btn-text:#0e061d;--btn-border:transparent}
    .btn--ghost{--btn-bg:rgba(255,255,255,.06)}
    .btn--outline{--btn-bg:transparent;--btn-text:var(--text);--btn-border:rgba(139,92,246,.6)}
    .btn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}

    .skip-link{position:absolute;left:var(--space-4);top:var(--space-4);z-index:1000;padding:.5rem .75rem;border-radius:.5rem;background:var(--accent);color:#0e061d;font-weight:800;transform:translateY(-200%);transition:transform var(--dur) var(--ease)}
    .skip-link:focus{transform:none}

    header.site-header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(18,18,25,.92),rgba(18,18,25,.6) 60%,transparent);backdrop-filter:saturate(120%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .mast{display:flex;justify-content:center;align-items:center;padding:var(--space-3) 0;min-height:56px}
    .nav__list{display:flex;align-items:center;justify-content:center;gap:.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
    .nav__link{display:inline-block;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent;transition:border-color var(--dur), background var(--dur)}
    .nav__link:hover{text-decoration:none;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6)}
    .nav__link:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 4px rgba(139,92,246,.6)}
    .nav__link--highlight{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}

    .intro{position:relative;isolation:isolate;text-align:center;padding:clamp(3rem,8vw,8rem) 0 var(--space-16);background:radial-gradient(1200px 800px at 90% -10%, rgba(139,92,246,.18), transparent 60%),linear-gradient(180deg, rgba(139,92,246,.08), transparent 30%)}
    .intro__title--brand{margin:.4rem auto;line-height:1.02;font-size:clamp(2.8rem,8vw,4.25rem);font-weight:1000;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 2px 0 rgba(255,255,255,.04)}
    .intro__subtitle{margin:.2rem auto 0 auto;font-size:clamp(1.4rem,3.5vw,1.6rem);font-weight:800;color:var(--muted)}
    .intro__logo{margin:var(--space-2) auto var(--space-6) auto;width:min(360px, 60vw);height:auto}
    .intro__cta{display:flex;justify-content:center;flex-wrap:wrap;gap:.75rem;margin-top:var(--space-4)}
    .fine{font-size:.95rem;color:var(--muted)}

    footer.site-footer{padding:var(--space-12) 0 var(--space-16);border-top:1px solid rgba(255,255,255,.08);color:var(--muted);position:relative}
    .footer-legal{position:absolute;right:var(--space-4);bottom:var(--space-4);font-size:0.85rem;display:flex;align-items:center;gap:var(--space-3)}
    .footer-legal a{color:var(--accent)}
    .footer-legal a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

<!-- Navigation Bar -->
  <header class="site-header" role="banner">
    <div class="container mast">
      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link nav__link--highlight" href="home.html">Home</a></li>
          <li><a class="nav__link" href="tools.html">Tools</a></li>
          <li><a class="nav__link" href="/toolpages/powerful-sites.html">Powerful Websites</a></li>
          <li><a class="nav__link" href="news-and-updates.html">News & Updates</a></li>
          <li><a class="nav__link" href="about.html">About</a></li>
          <li><a class="nav__link" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

<!-- Main Content -->
  <main id="main" tabindex="-1">
    <section class="intro">
      <div class="container">
        <div class="stack" style="align-items:center">
          <img class="intro__logo" src="../media/logo.png" width="1024" height="256" alt="riyst.com logo" loading="lazy" />
          <h1 class="intro__title--brand">riyst.com</h1>
          <p class="intro__subtitle">A unique website</p>
          <p class="fine">No ads, no bloat — just the good bits</p>

          <div class="intro__cta">
            <a class="btn btn--outline" href="tools.html">Click here for Tools</a>
            <a class="btn btn--outline" href="/toolpages/powerful-sites.html">Click here for Powerful Websites</a>
            <a class="btn btn--outline" href="news-and-updates.html">Click here for News & Updates</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo" style="padding: var(--space-6) 0;">
    <div class="container" style="text-align:center; position:relative;">
      <p class="fine" style="margin:0">
        &copy; <span id="year">2025</span> riyst.com
      </p>
      <div class="footer-legal">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="https://buymeacoffee.com/riyst">Support/Donate</a>
      </div>
    </div>
  </footer>

  <script>
    (function(){
      const y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
